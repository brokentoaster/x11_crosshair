name: ci-image

on:
  push:
    branches: [main]
    paths:
      - "ci/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/plops/x11-crosshair-ci
  VERSION: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}